<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inconsolata:wght@200..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Space+Grotesk:wght@300..700&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
    <title>AI Virtual Assistant | StyleSync</title>
    <style>
        body {
            background-color: white;
            color: black;
            font-family: 'IBM Plex Mono', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 2s ease-out forwards;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .intro {
            display: flex;
            align-items: center; 
            justify-content: center;
            margin-bottom: 20px;
        }
        .intro h1 {
            margin-bottom: 0; 
            margin-right: 10px; 
            background-image: linear-gradient(to right, #367D7B, #453F77);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2.5em; 
            animation: gradient-animation 3s ease infinite alternate;
            background-size: 200% 100%;
            font-weight: bolder;
        }

        @keyframes gradient-animation {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .responses {
            flex-grow: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .response-box {
            background-color: #f8f8f8;
            color: black;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            max-width: 80%; 
            width: fit-content;
        }
        .loading-animation {
            display: flex;
            justify-content: center;
            margin-bottom: 15px; 
        }
        .input-container {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            border-top: 1px solid #ccc;
        }
        .input-box {
            flex-grow: 1;
            border: 1px solid #ccc;
            border-radius: 25px;
            padding: 10px 15px;
            font-size: 16px;
            margin-right: 10px;
            max-width: 600px;
        }
        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-right: 10px;
        }
        .upload-btn {
            background-color: #f0f0f0;
            color: black;
            border: none;
            border-radius: 50%;
            padding: 10px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .upload-btn svg {
            width: 20px;
            height: 20px;
        }
        .upload-input {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }
        .send-btn {
            background-color: black;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
        }

    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">StyleSync</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/my-closet">My Closet</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/virtual-assistant">Virtual Assistant</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ai-trend-advisor">AI Trend Advisor</a></li>
                    <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                    <li class="nav-item"><a class="nav-link" href="/user-account"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                    </svg></a></li>
                </ul>
            </div>
        </div>
    </nav>
    <br><br>
    <div class="intro">
        <h1 style="font-size: 2.5em;">StyleSync</h1>
        <dotlottie-player
            src="https://lottie.host/83da13c1-3964-43da-82a0-1a4948c97f36/5gOIsDqXPP.lottie"
            background="transparent"
            speed="1"
            style="width: 75px; height: 75px; display: inline-block; vertical-align: middle;"
            loop
            autoplay
          ></dotlottie-player>
    </div>

    <br>
    <div class="responses">

    </div>
    <div class="input-container">
        <div class="upload-btn-wrapper">
            <button class="upload-btn">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6">
                    <path fill-rule="evenodd" d="M18.685 19.089A9 9 0 0 1 12 21.75a9 9 0 0 1-6.685-2.661A6.5 6.5 0 0 0 12 19.5a6.5 6.5 0 0 0 6.685-2.411ZM12 3.75a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9ZM12 1.5a6.75 6.75 0 1 0 0 13.5A6.75 6.75 0 0 0 12 1.5Z" clip-rule="evenodd" />
                  </svg>
                <input type="file" id="imageUpload" class="upload-input" multiple accept="image/*">
            </button>
        </div>
        <input type="text" class="input-box" id="promptText" placeholder="Enter your text and press Send">
        <button class="send-btn" onclick="sendToAI()">Send</button>
    </div>

    <script>
        const conversationHistory = [];

        async function sendToAI() {
            const promptText = document.getElementById('promptText').value;
            const imageInput = document.getElementById('imageUpload');
            const files = imageInput.files;
            const formData = new FormData();

            formData.append('prompt', promptText);
            for (let i = 0; i < files.length; i++) {
                formData.append('images', files[i]);
            }
            formData.append('history', JSON.stringify(conversationHistory));

            const responseDiv = document.querySelector('.responses');
            responseDiv.innerHTML = `
                <div class="loading-animation">
                    <dotlottie-player
                      src="https://lottie.host/fdcbaa1d-2703-4814-ac80-4757862320bb/asaVvRXEQj.lottie"
                      background="transparent"
                      speed="1"
                      style="width: 150px; height: 150px"
                      loop
                      autoplay></dotlottie-player>
                </div>
            `;

            try {
                const response = await fetch('/ask-ai-outfit', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    const aiResponse = `<div class="response-box"><strong>AI:</strong> ${data.suggestion}</div>`;
                    responseDiv.innerHTML = aiResponse; 
                    conversationHistory.push({ role: "assistant", content: data.suggestion }); 
                } else {
                    const errorData = await response.json();
                    responseDiv.innerHTML = `<div class="response-box text-danger">Error: ${errorData.error || response.statusText}</div>`;
                }
            } catch (error) {
                console.error("Fetch error:", error);
                responseDiv.innerHTML = `<div class="response-box text-danger">Failed to send request to AI.</div>`;
            } finally {
                conversationHistory.push({ role: "user", content: promptText, images: files.length > 0 ? "uploaded" : null }); 
                document.getElementById('promptText').value = '';
                document.getElementById('imageUpload').value = '';
            }
        }
        function displayConversationHistory() {
            const responseDiv = document.querySelector('.responses');
            responseDiv.innerHTML = '';
            conversationHistory.forEach(message => {
                if (message.role === 'user') {
                    responseDiv.innerHTML += `<div class="response-box"><strong>You:</strong> ${message.content} ${message.images === 'uploaded' ? '(Image(s) Uploaded)' : ''}</div>`;
                } else if (message.role === 'assistant') {
                    responseDiv.innerHTML += `<div class="response-box"><strong>AI:</strong> ${message.content}</div>`;
                }
            });
        }
        displayConversationHistory();
    </script>
    <script
    src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs"
    type="module"
  ></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js" integrity="sha384-IQsoLXl5PILFhosVNubq5LC7Qb9DXgDA9i+tQ8Zj3iwWAwPtgFTxbJ8NT4GN1R8p" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" integrity="sha384-cVKIPhGWiC2Al4u+LWgxfKTRIcfu0JTxR+EQDz/bgldoEyl4H0zUF0QKbrJ0EcQF" crossorigin="anonymous"></script>
</body>
</html>
