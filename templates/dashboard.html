  <script>
    function typeWriterHTML(htmlString, elementId, speed = 40) {
      const element = document.getElementById(elementId);
      element.innerHTML = ""; // Clear content
  
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlString, 'text/html');
      const nodes = Array.from(doc.body.childNodes);
  
      let index = 0;
  
      function typeNode(nodeList, parent) {
        if (index >= nodeList.length) return;
  
        const node = nodeList[index];
        index++;
  
        if (node.nodeType === Node.TEXT_NODE) {
          let text = node.textContent;
          let charIndex = 0;
  
          function typeChar() {
            if (charIndex < text.length) {
              parent.append(text.charAt(charIndex));
              charIndex++;
              setTimeout(typeChar, speed);
            } else {
              typeNode(nodeList, parent);
            }
          }
  
          typeChar();
        } else if (node.nodeType === Node.ELEMENT_NODE) {
          const el = document.createElement(node.nodeName);
          Array.from(node.attributes).forEach(attr => el.setAttribute(attr.name, attr.value));
          parent.appendChild(el);
          const children = Array.from(node.childNodes);
          let childIndex = 0;
          const saveIndex = index;
          index = 0;
  
          function typeChildren() {
            if (index >= children.length) {
              index = saveIndex;
              typeNode(nodeList, parent);
            } else {
              typeNode(children, el);
            }
          }
  
          typeChildren();
        } else {
          typeNode(nodeList, parent);
        }
      }
  
      typeNode(nodes, element);
    }
  
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const lat = position.coords.latitude;
        const lon = position.coords.longitude;
        const apiKey = "0ea751ed0c33a5f59db8c07f4a135fe0";
  
        fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric`)
          .then(response => {
            if (!response.ok) throw new Error(`Weather API error: ${response.status}`);
            return response.json();
          })
          .then(data => {
            const temp = Math.round(data.main.temp);
            const condition = data.weather[0].main;
  
            const emojiMap = {
              Clear: "☀️",
              Clouds: "☁️",
              Rain: "🌧️",
              Drizzle: "🌦️",
              Thunderstorm: "⛈️",
              Snow: "❄️",
              Mist: "🌫️"
            };
  
            const emoji = emojiMap[condition] || "🌡️";
            document.getElementById('weather-temp').innerText = `${emoji} ${temp}°C ${condition}`;
  
            let suggestion = "something comfy";
            if (["Rain", "Drizzle", "Thunderstorm"].includes(condition)) {
              suggestion = "a <span id='high'>raincoat or waterproof jacket</span>";
            } else if (condition === "Snow") {
              suggestion = "a <span id='high'>heavy coat and gloves</span>";
            } else if (temp >= 30) {
              suggestion = "a <span id='high'>breathable t-shirt and shorts</span>";
            } else if (temp >= 20) {
              suggestion = "a <span id='high'>light t-shirt or casual shirt</span>";
            } else if (temp >= 12) {
              suggestion = "a <span id='high'>hoodie or light jacket</span>";
            } else if (temp >= 5) {
              suggestion = "a <span id='high'>sweater and jeans</span>";
            } else {
              suggestion = "a <span id='high'>warm coat, scarf, and boots</span>";
            }
  
            const message = `Pro Tip: Today, try wearing ${suggestion}.`;
            typeWriterHTML(message, "clothing-suggestion");
          })
          .catch(error => {
            console.error(error);
            typeWriterHTML("❌ Can't suggest an outfit right now.", "clothing-suggestion");
          });
      },
      (error) => {
        console.error("Geolocation error:", error.message);
        typeWriterHTML("📍 Please enable location for suggestions.", "clothing-suggestion");
      }
    );
    function animateHeroSection() {
  const elements = document.querySelectorAll('.hero-animate');
  elements.forEach((el, index) => {
    el.classList.add('pop-in');
    el.style.animationDelay = `${index * 0.3}s`;
  });
}

animateHeroSection()
