<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital,wght@0,400..700;1,400..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

  <title>Onboarding 🚀 | StyleSync</title>
  <style>
    .next {
      color: black;
      background-color: #f26b00;
      width: fit-content;
      height: fit-content;
      padding: 10px 20px;
      display: block;
      margin: 40px auto 0;
      border: none;
      font-weight: bold;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #D43790;
      font-family: 'Montserrat', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: black;
      opacity: 0;
      animation: fadeIn 1.5s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .container {
      text-align: center;
    }

    .checkbox-group {
      text-align: left;
      margin-top: 30px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .form-check {
      margin-bottom: 15px;
    }

    label {
      font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 style="font-family: 'Lora',sans-serif;">Almost there....</h1>
    <br>
    <h2 style="font-family: 'Lora',sans-serif;">What best describes your style?</h2>

    <form action="/decribe-your-style" method="POST" class="checkbox-group">
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Minimalist" id="c1">
        <label class="form-check-label" for="c1">Minimalist 🖤</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Bold & Trendy" id="c2">
        <label class="form-check-label" for="c2">Bold & Trendy 💥</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Classic & Elegant" id="c3">
        <label class="form-check-label" for="c3">Classic & Elegant ✨</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Casual & Comfortable" id="c4">
        <label class="form-check-label" for="c4">Casual & Comfortable 😎</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Sporty & Active" id="c5">
        <label class="form-check-label" for="c5">Sporty & Active 🏋️</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Boho & Artsy" id="c6">
        <label class="form-check-label" for="c6">Boho & Artsy 🎨</label>
      </div>
      <div class="form-check">
        <input class="form-check-input" type="checkbox" name="style" value="Eclectic & Creative" id="c7">
        <label class="form-check-label" for="c7">Eclectic & Creative 🌈</label>
      </div>

      <a href="/dashboard" style="text-decoration: none; color:black;"><button class="next" type="submit">Next
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" fill="none">
          <path d="M20 12H4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15 17C15 17 20 13.318 20 12C20 10.682 15 7 15 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button></a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js" crossorigin="anonymous"></script>
</body>
</html>
